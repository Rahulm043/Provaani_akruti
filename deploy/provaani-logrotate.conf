# Provaani Production — Logrotate Configuration
# Install: sudo cp deploy/provaani-logrotate.conf /etc/logrotate.d/provaani

/var/log/provaani_warmup.log
/var/log/provaani_cleanup.log
/var/log/provaani_backup.log
/var/log/provaani_ssl_renew.log
/var/log/provaani_monitor.log
{
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
}
