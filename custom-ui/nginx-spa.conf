map $uri $media_content_type {
    ~\.wav$            audio/wav;
    ~\.mp3$            audio/mpeg;
    ~\.txt$            "text/plain; charset=utf-8";
    default            application/octet-stream;
}

# HTTP server (Port 80 & 3011)
server {
    listen 80;
    server_name _ localhost *.provaani.xyz akruti.provaani.xyz provaani.xyz;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /voice-audio/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_hide_header Content-Type;
        add_header Content-Type $media_content_type always;
    }

    location /analysis/ {
        proxy_pass http://analysis-service:8001/analyze/;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}

# HTTPS server (Port 443 with Let's Encrypt SSL)
server {
    listen 443 ssl;
    http2 on;
    server_name _ localhost *.provaani.xyz akruti.provaani.xyz provaani.xyz;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/akruti.provaani.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akruti.provaani.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /voice-audio/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_hide_header Content-Type;
        add_header Content-Type $media_content_type always;
    }

    location /analysis/ {
        proxy_pass http://analysis-service:8001/analyze/;
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
